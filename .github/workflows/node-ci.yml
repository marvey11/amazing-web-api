name: Node CI

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "yarn"

      - name: Install packages
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn run build

      - name: Static Code Checks
        run: yarn run lint
